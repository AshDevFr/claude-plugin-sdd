# Beacon reads one file. Incidents are an array of tables; updates are an array inside each.
# Times are TOML date-times and are treated as UTC.

[[incident]]
id = "2026-09-14-checkout-latency"
title = "Elevated checkout latency in eu-west"
severity = "monitoring"
started = 2026-09-14T08:12:00Z
components = ["Checkout", "Payments"]

  [[incident.updates]]
  at = 2026-09-14T08:12:00Z
  body = "Checkout p95 crossed 4 s in eu-west. Investigating."

  [[incident.updates]]
  at = 2026-09-14T08:41:00Z
  body = "Traced to a connection pool exhausted by a slow downstream. Pool size raised."

  [[incident.updates]]
  at = 2026-09-14T09:05:00Z
  body = "Latency back under 900 ms. Monitoring before we call it resolved."

